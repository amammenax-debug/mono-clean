name: Build Mono Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate clean MonoClient.java
        run: |
          mkdir -p src/main/java/su/mono/visuals
          mkdir -p src/main/resources
          find . -maxdepth 3 -type f -iname "fabric.mod*" -exec cp {} src/main/resources/fabric.mod.json \;
          cat << 'EOF' > src/main/java/su/mono/visuals/MonoClient.java
          package su.mono.visuals;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.minecraft.client.DeltaTracker;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.multiplayer.PlayerInfo;
          import net.minecraft.core.BlockPos;
          import net.minecraft.network.chat.Component;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;

          public class MonoClient implements ClientModInitializer {

              public static final List<MonoModule> MODULES = new ArrayList<>();
              private static KeyMapping openMenuKey;

              @Override
              public void onInitializeClient() {
                  MODULES.clear();
                  MODULES.add(new MonoModule("Mono Bar", "Верхняя панель FPS, пинга и координат", "HUD", true));
                  MODULES.add(new MonoModule("Mono Keys", "Отображение нажатий WASD и кликов мыши", "HUD", false));
                  MODULES.add(new MonoModule("Armor Status", "Показ прочности своей брони", "HUD", false));
                  MODULES.add(new MonoModule("Mono Swing", "Плавная анимация взмаха руки", "Visuals", true));
                  MODULES.add(new MonoModule("Ghost Hit", "Чёрно-белые частицы при ударе", "Visuals", false));
                  MODULES.add(new MonoModule("Atmosphere", "Настройка времени суток и тумана", "World", false));

                  openMenuKey = KeyBindingHelper.registerKeyBinding(new KeyMapping(
                          "key.mono.open_menu",
                          InputConstants.Type.KEYSYM,
                          GLFW.GLFW_KEY_RIGHT_SHIFT,
                          "category.mono.main"
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (openMenuKey.consumeClick()) {
                          if (client.screen == null) {
                              client.setScreen(new DeltaMenuScreen());
                          }
                      }
                  });

                  HudRenderCallback.EVENT.register(this::renderHud);
              }

              private void renderHud(GuiGraphics graphics, DeltaTracker deltaTracker) {
                  Minecraft client = Minecraft.getInstance();
                  if (client.player == null || client.options.hideGui) return;

                  MonoModule monoBar = getModule("Mono Bar");
                  if (monoBar != null && monoBar.enabled) {
                      int fps = client.getFps();
                      int ping = getPlayerPing(client);
                      BlockPos pos = client.player.blockPosition();

                      String brand = "MONO";
                      String stats = String.format("  %d FPS  •  %d MS  •  %d, %d, %d",
                              fps, ping, pos.getX(), pos.getY(), pos.getZ());

                      int x = 10, y = 10, padX = 6, padY = 4;
                      int brandW = client.font.width(brand);
                      int totalW = brandW + client.font.width(stats) + padX * 2;
                      int height = client.font.lineHeight + padY * 2;

                      graphics.fill(x, y, x + totalW, y + height, 0xB00B0B0D);
                      graphics.fill(x, y, x + 2, y + height, 0xFFFFFFFF);
                      graphics.drawString(client.font, brand, x + padX, y + padY + 1, 0xFFFFFFFF, false);
                      graphics.drawString(client.font, stats, x + padX + brandW, y + padY + 1, 0xFFB0B0B5, false);
                  }
              }

              private int getPlayerPing(Minecraft client) {
                  if (client.getConnection() == null || client.player == null) return 0;
                  PlayerInfo info = client.getConnection().getPlayerInfo(client.player.getUUID());
                  return info != null ? info.getLatency() : 0;
              }

              public static MonoModule getModule(String name) {
                  for (MonoModule m : MODULES) {
                      if (m.name.equalsIgnoreCase(name)) return m;
                  }
                  return null;
              }

              public static class MonoModule {
                  public final String name;
                  public final String description;
                  public final String category;
                  public boolean enabled;

                  public MonoModule(String name, String description, String category, boolean enabled) {
                      this.name = name;
                      this.description = description;
                      this.category = category;
                      this.enabled = enabled;
                  }

                  public void toggle() {
                      this.enabled = !this.enabled;
                  }
              }

              public static class DeltaMenuScreen extends Screen {
                  private EditBox searchBox;
                  private String searchQuery = "";
                  private final int panelWidth = 420;
                  private final int panelHeight = 260;

                  public DeltaMenuScreen() {
                      super(Component.literal("Mono Menu"));
                  }

                  @Override
                  protected void init() {
                      int left = (this.width - panelWidth) / 2;
                      int top = (this.height - panelHeight) / 2;

                      this.searchBox = new EditBox(
                              this.font,
                              left + panelWidth - 150,
                              top + 10,
                              138,
                              18,
                              Component.literal("Поиск...")
                      );
                      this.searchBox.setHint(Component.literal("Поиск модуля..."));
                      this.searchBox.setBordered(true);
                      this.searchBox.setResponder(text -> this.searchQuery = text.toLowerCase().trim());
                      this.addRenderableWidget(this.searchBox);
                      this.setInitialFocus(this.searchBox);
                  }

                  @Override
                  public void render(GuiGraphics graphics, int mouseX, int mouseY, float partialTick) {
                      graphics.fill(0, 0, this.width, this.height, 0x70000000);

                      int left = (this.width - panelWidth) / 2;
                      int top = (this.height - panelHeight) / 2;
                      int right = left + panelWidth;
                      int bottom = top + panelHeight;

                      graphics.fill(left, top, right, bottom, 0xF00D0D10);
                      drawBorder(graphics, left, top, panelWidth, panelHeight, 0x35FFFFFF);

                      graphics.fill(left, top, right, top + 38, 0xFF141418);
                      graphics.fill(left, top + 38, right, top + 39, 0x25FFFFFF);
                      graphics.drawString(this.font, "MONO", left + 14, top + 15, 0xFFFFFFFF, false);
                      graphics.drawString(this.font, "v1.0", left + 48, top + 15, 0xFF707078, false);

                      List<MonoModule> filtered = getFilteredModules();
                      int cardWidth = (panelWidth - 36) / 2;
                      int cardHeight = 42;
                      int startX = left + 12;
                      int startY = top + 48;

                      for (int i = 0; i < filtered.size(); i++) {
                          MonoModule module = filtered.get(i);
                          int col = i % 2;
                          int row = i / 2;
                          int cardX = startX + col * (cardWidth + 12);
                          int cardY = startY + row * (cardHeight + 8);

                          if (cardY + cardHeight > bottom - 8) break;

                          boolean hovered = mouseX >= cardX && mouseX <= cardX + cardWidth
                                  && mouseY >= cardY && mouseY <= cardY + cardHeight;

                          int bgColor = module.enabled
                                  ? (hovered ? 0xFF24242A : 0xFF1C1C22)
                                  : (hovered ? 0xFF17171C : 0xFF121216);

                          graphics.fill(cardX, cardY, cardX + cardWidth, cardY + cardHeight, bgColor);
                          graphics.fill(cardX, cardY, cardX + 3, cardY + cardHeight,
                                  module.enabled ? 0xFFFFFFFF : 0x25FFFFFF);

                          graphics.drawString(this.font, module.name, cardX + 10, cardY + 8,
                                  module.enabled ? 0xFFFFFFFF : 0xFFA0A0A8, false);

                          String status = module.enabled ? "ON" : "OFF";
                          int statusW = this.font.width(status);
                          graphics.drawString(this.font, status, cardX + cardWidth - statusW - 10, cardY + 8,
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mono-mod-jar
          path: build/libs/*.jar
