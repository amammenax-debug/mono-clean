name: Build Mono Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Organize project files
        run: |
          mkdir -p src/main/java/su/mono/visuals
          mkdir -p src/main/resources
          find . -maxdepth 3 -type f \( -iname "*mono*.java*" -o -iname "*mono*.txt" \) -exec cp {} src/main/java/su/mono/visuals/MonoClient.java \;
          find . -maxdepth 3 -type f -iname "fabric.mod*" -exec cp {} src/main/resources/fabric.mod.json \;
          ls -la src/main/java/su/mono/visuals/
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Mod
        run: gradle build
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mono-mod
          path: build/libs/*.jar

